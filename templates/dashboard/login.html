{% extends "dashboard/includes/authentication.html" %}

{% load static %}

{% block site_title %}{{"Login"}}{% endblock %}

{% block content %}
<div class="content-top-agile p-20 pb-0">
	<h2 class="text-primary">Let's Get Started</h2>
	<p class="mb-0">Sign in to continue.</p>
	<p class="mb-0 error">{{error}}</p>
</div>
<div class="p-40">
	<form action="#" name="frm_login" id="frm_login" method="post">
		{% csrf_token %}
		<div class="form-group">
			<div class="input-group mb-3">
				<span class="input-group-text bg-transparent"><i class="fa fa-user"></i></span>
				<input type="number" name="username" id="log_uname" class="form-control ps-15 bg-transparent" placeholder="Mobile Number" required>
			</div>
		</div>
		<div class="form-group">
			<div class="input-group mb-3">
				<span class="input-group-text  bg-transparent"><i class="fa fa-lock"></i></span>
				<input type="password" name="password" id="log_pass" class="form-control ps-15 bg-transparent" placeholder="Password" required>
			</div>
		</div>
		<div class="row">
			<div class="col-6">
				<div class="checkbox">
					<input type="checkbox" id="show_pass">
					<label for="show_pass">Show Password</label>
				</div>
			</div>
			<div class="col-6">
				<div class="fog-pwd text-end">
					<a href="forgot-password" class="hover-warning"><i class="fa fa-lock"></i> Forgot password?</a><br>
				</div>
			</div>
			<div class="col text-center">
				<button type="submit" name="btn_login" id="btn_login" class="btn btn-danger mt-10">Sign In</button>
			</div>
		</div>
	</form>		
</div>	
{% endblock %}
