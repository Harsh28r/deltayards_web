{% load static %}
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="description" content="Virash Technologies provides innovative multichannel e-commerce solutions for retailers of both mid-cap and large-cap.">
		<meta name="author" content="Virash Technologies LLP">
		<link rel="icon" href="{% static 'dashboard/img/favicon.png' %}">
		<title>Delta Yards | {% block site_title %}{% endblock %}</title>
		<base href="/">
		<link rel="stylesheet" href="{% static 'dashboard/css/vendors_css.css' %}">
		<link rel="stylesheet" href="{% static 'dashboard/css/horizontal-menu.css' %}"> 
		<link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
		<link rel="stylesheet" href="{% static 'dashboard/css/skin_color.css' %}">	
		<link rel="stylesheet" href="{% static 'dashboard/js/validation/sweetalert/sweetalert.css' %}">
		<style>
			.error
			{
				display: block;
    			width: 100%;
			}
		</style>
	</head>
	<body class="hold-transition theme-primary bg-img">
		<div class="container h-p100">
			<div class="row align-items-center justify-content-md-center h-p100">		
				<div class="col-12">
					<div class="row justify-content-center g-0">
						<div class="col-lg-5 col-md-5 col-12">
							<div class="content-top-agile p-20">
								<img src="{% static 'dashboard/img/logo.png' %}" width="80%">
							</div>
							<div class="bg-white rounded10 shadow-lg">
                                {% block content %}{% endblock %}	
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		{% include "dashboard/includes/loading.html" %}
		<!-- Vendor JS -->
		<script src="{% static 'dashboard/js/vendors.min.js' %}"></script>
		<script src="{% static 'dashboard/js/pages/chat-popup.js' %}"></script>
		<script src="{% static 'dashboard/assets/icons/feather-icons/feather.min.js' %}"></script>	
		<script src="{% static 'dashboard/js/action/authenticate.js' %}"></script>
		<script type="text/javascript" src="{% static 'dashboard/js/validation/jquery.validate.min.js' %}"></script>
		<script src="{% static 'dashboard/js/validation/jquery.form.min.js' %}"></script>
		<script src="{% static 'dashboard/js/validation/authentication-validate.js' %}"></script>
		<script src="{% static 'dashboard/js/validation/sweetalert/sweetalert.min.js' %}" type="text/javascript"></script>
	</body>
</html>
