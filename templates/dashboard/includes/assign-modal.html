{% load static %}
<div id="tc-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true" style="display: none;" data-bs-backdrop="static" data-bs-keyboard="false">
	<div class="modal-dialog modal-md"> 
		<div class="modal-content"> 
			<div class="modal-header"> 
				<h4 class="modal-title">
					<i class="fa fa-users"></i> Assign Leads
				</h4>
				<button type="button" class="close close-modal" data-bs-dismiss="modal" aria-hidden="true">×</button> 
			</div> 
			<form name="frm_AssignTeleCaller" class="form-horizontal" id="frm_AssignTeleCaller" method="post" action="#">
				{% csrf_token %}
				<input type="hidden" id="chk_checked" name="leadIds"/>
                <input type="hidden" id="class_id" name="class_id"/>
				<div class="modal-body"> 
					<div id="modal-loader" style="display: none; text-align: center;">
						<img src="{% static 'dashboard/img/ajax-loader.gif' %}">
					</div>
					<div id="edit-dynamic-content">
						<div class="col-lg-12 col-12">
							<div class="box">
								<div class="box-body">
									<div class="media-list media-list-divided media-list-hover data">
										<!--Dynamic Content-->
									</div>
								</div>
								<!-- /.box-body -->
							</div>
							<!-- /. box -->
						</div>
					</div>
				</div> 
				<div class="modal-footer"> 
					<div class="col-md-12 mb10">
						<button type="submit" name="btn_AssignTeleCaller" id="btn_AssignTeleCaller" class="btn btn-primary pull-right">Submit</button>
					</div>
				</div>
			</form>
		</div> 
	</div>
</div>
