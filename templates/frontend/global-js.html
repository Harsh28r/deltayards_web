<script type="module">
    import { Fancybox } from "https://cdn.jsdelivr.net/npm/@fancyapps/ui/dist/fancybox.esm.js";
</script>
<script>
    window.document.onkeydown = function(e) {
        if (!e) {
            e = event;
        }
        if (e.keyCode == 27) {
            lightbox_close();
        }
        }
    
    window.onload =function lightbox_open() {
        var lightBoxVideo = document.getElementById("VisaChipCardVideo");
        window.scrollTo(0, 0);
        document.getElementById('light').style.display = 'block';
        document.getElementById('fade').style.display = 'block';
        lightBoxVideo.play();
        
    }
    
    function lightbox_close() {
        var lightBoxVideo = document.getElementById("VisaChipCardVideo");
        document.getElementById('light').style.display = 'none';
        document.getElementById('fade').style.display = 'none';
        lightBoxVideo.pause();
    }
</script>

<script>
    document.onkeydown = function(e) {
        if(e.keyCode == 123) {
            return false;
        }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)){
            return false;
        }
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)){
            return false;
        }
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)){
            return false;
        }

        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)){
            return false;
        }      
    }

</script>
<script>
    $('#single-property').layerSlider({
        sliderVersion: '6.5.0b2',
        type: 'popup',
        pauseOnHover: 'disabled',
        skin: 'photogallery',
        globalBGSize: 'cover',

        popupShowOnTimeout: 1,
        popupShowOnce: false,
        popupCloseButtonStyle: 'background: rgba(0,0,0,.5); border-radius: 2px; border: 0; left: auto; right: 10px;',
        popupResetOnClose: 'disabled',
        popupDistanceLeft: 20,
        popupDistanceRight: 20,
        popupDistanceTop: 20,
        popupDistanceBottom: 20,
        popupDurationIn: 750,
        popupDelayIn: 500,
        popupTransitionIn: 'scalefromtop',
        popupTransitionOut: 'scaletobottom',
        skinsPath: 'assets/skins/'
    });

    // Statistic
    if (document.querySelector('#mychart') !== null) {
        var ctx = document.getElementById("mychart").getContext('2d');

        // Data with datasets options
        var data = {
            type: 'line',
            labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct"],
            datasets: [{
                label: 'Growth',
                fill: true,
                backgroundColor: "#def7e0",
                borderColor: "#17c788",
                data: [0, 150, 450, 400, 480, 630, 580, 500, 530, 400, 430, 600, 400],
            }]
        }

        // Chart declaration with some options:
        var mychart = new Chart(ctx, {
            type: 'line',
            data: data,
        });
    }

    //Doughnut and Pie
    if (document.querySelector('#mychart-2') !== null) {
        var ctx2 = document.getElementById("mychart-2").getContext('2d');

        // Data with datasets options
        var data2 = {
            type: 'doughnut',
            labels: ['Desktop', 'Tablet', 'Mobile'],
            datasets: [{
                data: [10, 20, 30],
                backgroundColor: ['rgb(255, 99, 132)', 'rgb(54, 162, 235)', 'rgb(255, 205, 86)']
            }],

        };

        // For a pie chart
        var myPieChart = new Chart(ctx2, {
            type: 'pie',
            data: data2,
        });
        // And for a doughnut chart
        var myDoughnutChart = new Chart(ctx2, {
            type: 'doughnut',
            data: data2,
        });
    }
</script>
<script type="text/javascript" src="{% static 'dashboard/js/validation/jquery.validate.min.js' %}"></script>

<script>

        $("#btn_contact").click(function(e)

					name:

						required: true

						digits:true
					},

                        required:true,
						email:true

						required:true,
                        minlength:20,

					}
                },

					name: 
					{
						required: "Please enter your name"
					},

						required: "Please enter 10 digits mobile number",

                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>\
                                </div>')
                                setTimeout(function(){ $("#response").html(''); }, 5000);

                            }
                            else if(response.success==0)
                            {
                                $("#response").html('<div class="alert alert-danger alert-dismissible fade show" role="alert">\

                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>\
