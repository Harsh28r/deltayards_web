{% extends 'frontend/base.html'%}
{% load static %}
{% block content%}
<div class="full-row p-0">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <center >
                    <img style="width:300px; height:300px; margin: 125px auto 30px; " src="static/frontend/images/career/join our team.jpeg" class="ls-bg " alt="" />
                </center>
            </div>
        </div>
    </div>
</div>
<div class="col-xl-8 order-xl-1 mx-auto ">
    <div class="border summary rounded bg-white p-30 mb-30">
        <div class="row mb-4">
            <div class="col-auto">
                <h4 class="listing-title"><a href="JobDetails?id={{job_desc.unique_id}}">{{job_desc.job_title}}</a></h4>
            </div>
        </div>
        <div class="row row-cols-1">
            <div class="col">
                <h5 class="mb-3">Description</h5>
                <textarea disabled class="form-control" rows="15">{{job_desc.job_description}}</textarea>
            </div>
        </div>
        <div class="d-flex align-items-center post-meta mt-2 py-3 px-4 border-top">
            <a class="btn btn-primary quick-view" style="margin: 10px;padding: 10px;border-right: 1px solid #e1e1e1;display: inline-block;line-height: inherit;font-weight: 500;" href="#apply-view"><i class="fas fa-save"></i> Apply</a>
        </div>
    </div>
</div>
        
{% endblock %}
