<style>
    #fade 
    {
        display: none;
        position: fixed;
        top: 0%;
        left: 0%;
        width: 100%;
        height: 100%;
        background-color: black;
        z-index: 1001;
        -moz-opacity: 0.8;
        opacity: .80;
        filter: alpha(opacity=80);
    }

    #light 
    {
        display: none;
        position: absolute;
        top: 18%;
        left: 20%;
        max-width: 600px;
        max-height: 360px; 
        margin-left: -300px;
        margin-top: -180px;

        background: #FFF;
        z-index: 1002;
        overflow: visible;
    }

    #boxclose 
    {
    /*     float: right; */
        cursor: pointer;
        color: #fff;
        border: 1px solid #AEAEAE;
        border-radius: 3px;
        background: #222222;
        font-size: 31px;
        font-weight: bold;
        display: inline-block;
        line-height: 0px;
        padding: 11px 3px;
        position: absolute;
        right:-880px;
        top: 3px;
        
        z-index: 1002;
        opacity: 0.9;

    .boxclose:before 
    {
        content: "×";
    }

    #fade:hover ~ #boxclose
    {
        display:none;
    }

    .test:hover ~ .test2 
    {
        display: none;

    {
        animation: fadeIn 5s;

        -moz-animation: fadeIn 5s;
        -o-animation: fadeIn 5s;
        -ms-animation: fadeIn 5s;
    }
    
    @keyframes fadeIn {
    0% { opacity: 0; }

    0% { opacity: 0; }
    100% { opacity: 1; }
    }

    @-webkit-keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
    }

    0% { opacity: 0; }
